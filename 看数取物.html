<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 蚂蚁搬豆闯关 · 按数取物</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:"Yuanti SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:#CFEBFF;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  #game { position:fixed; inset:0; display:block; z-index:1; }
  .hud  { position:fixed; inset:0; z-index:10; pointer-events:none; }

  /* ============ 顶部任务条（数字超大超醒目） ============ */
  .topbar {
    position:absolute; top:2.4vh; left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:.45em;
    padding:1.2vh 2.6vw;
    background:linear-gradient(180deg,#FFFFFF,#FFF6E8);
    border:6px solid #FFFFFF;
    border-radius:999px;
    box-shadow:0 18px 48px rgba(180,140,95,.36),
               0 0 0 11px rgba(255,255,255,.5),
               0 0 60px rgba(255,200,120,.5);
    font-size:clamp(24px,2.9vw,54px);
    font-weight:900; color:#8A5D36;
    letter-spacing:.04em; white-space:nowrap;
  }
  .mission-num {
    display:inline-flex; align-items:center; justify-content:center;
    width:1.72em; height:1.72em;
    background:linear-gradient(180deg,#FFD98A,#FFB13D);
    color:#FFFFFF;
    border-radius:50%;
    font-size:2.15em; font-weight:900;
    line-height:1;
    text-shadow:0 6px 0 rgba(190,120,30,.6),
                0 10px 22px rgba(190,120,30,.42);
    box-shadow:0 12px 0 #E8942B,
               0 20px 40px rgba(240,165,60,.55),
               0 0 46px rgba(255,200,110,.85),
               inset 0 -6px 14px rgba(190,120,30,.28),
               inset 0 6px 14px rgba(255,255,255,.5);
    border:5px solid #FFF3D8;
    animation:numBeat 1.7s ease-in-out infinite;
  }
  @keyframes numBeat {
    0%,100% { transform:scale(1); }
    50%     { transform:scale(1.12); }
  }

  /* ============ 积分牌 ============ */
  .score-board {
    position:absolute; top:2.8vh; left:2.4vw;
    display:flex; align-items:center; gap:.45em;
    padding:1.2vh 1.6vw;
    background:linear-gradient(180deg,#FFFFFF,#FFF3E2);
    border:4px solid #FFFFFF;
    border-radius:999px;
    box-shadow:0 12px 30px rgba(180,140,95,.26);
    font-size:clamp(15px,1.55vw,28px);
    font-weight:900; color:#B27C4E;
    letter-spacing:.04em;
  }
  .score-star { font-size:1.28em; }
  .score-val {
    color:#FF9A5B; font-size:1.24em;
    min-width:1.6em; text-align:center;
    font-variant-numeric:tabular-nums;
  }

  /* ============ 完成按钮 ============ */
  .btn-finish {
    position:absolute; left:50%; bottom:3vh;
    transform:translateX(-50%);
    padding:1.7vh 4.6vw;
    font-size:clamp(21px,2.2vw,40px);
    font-weight:900; font-family:inherit;
    color:#fff;
    letter-spacing:.16em; text-indent:.16em;
    background:linear-gradient(180deg,#7FE0B4,#3FC894);
    border:5px solid rgba(255,255,255,.92);
    border-radius:999px;
    box-shadow:0 11px 0 #2FA576, 0 20px 42px rgba(60,190,140,.46);
    cursor:pointer; pointer-events:auto;
    transition:transform .12s, box-shadow .12s, filter .2s;
  }
  .btn-finish:active {
    transform:translateX(-50%) translateY(7px);
    box-shadow:0 4px 0 #2FA576, 0 8px 16px rgba(60,190,140,.35);
  }
  .btn-finish:disabled {
    filter:grayscale(.65) opacity(.55);
    cursor:not-allowed;
    transform:translateX(-50%);
    box-shadow:0 11px 0 #B8B8B8;
  }

  /* ============ 结果面板 ============ */
  .result-panel {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.52);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; pointer-events:none;
    transition:opacity .38s ease;
  }
  .result-panel.show { opacity:1; pointer-events:auto; }

  .result-card {
    display:flex; flex-direction:column; align-items:center;
    gap:1.7vh;
    padding:5.5vh 7.5vw 5vh;
    background:linear-gradient(180deg,#FFFFFF,#FFF7EB);
    border:7px solid #fff;
    border-radius:5vh;
    box-shadow:0 32px 86px rgba(180,140,95,.38),
               0 0 0 14px rgba(255,255,255,.36);
    transform:scale(.65) rotate(-3deg);
    transition:transform .55s cubic-bezier(.2,1.6,.4,1);
  }
  .result-panel.show .result-card {
    transform:scale(1) rotate(0deg);
  }

  .result-emoji {
    font-size:clamp(60px,8vw,130px);
    line-height:1;
    animation:emojiJump 1.1s ease-in-out infinite;
  }
  @keyframes emojiJump {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50%     { transform:translateY(-14px) rotate(7deg); }
  }

  .result-title {
    font-size:clamp(30px,4.2vw,76px);
    font-weight:900;
    letter-spacing:.08em;
    white-space:nowrap;
  }
  .result-title.ok   { color:#37C08E; text-shadow:0 6px 0 #C6F2DF, 0 16px 38px rgba(60,200,150,.42); }
  .result-title.fail { color:#F2A03C; text-shadow:0 6px 0 #FFE6C4, 0 16px 38px rgba(240,170,80,.42); }

  .result-detail {
    font-size:clamp(16px,1.7vw,30px);
    font-weight:800; color:#B08A66;
    letter-spacing:.06em;
  }

  .btn-again {
    margin-top:1.5vh;
    padding:1.4vh 3.8vw;
    font-size:clamp(18px,1.8vw,32px);
    font-weight:900; font-family:inherit;
    color:#fff;
    letter-spacing:.14em; text-indent:.14em;
    background:linear-gradient(180deg,#FFC97A,#FF9F4D);
    border:none; border-radius:999px;
    box-shadow:0 9px 0 #E4803A, 0 16px 34px rgba(240,150,70,.44);
    cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .btn-again:active {
    transform:translateY(6px);
    box-shadow:0 3px 0 #E4803A, 0 8px 16px rgba(240,150,70,.35);
  }

  /* ============ 特效层 ============ */
  .fx-layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .fx-star {
    position:absolute;
    font-size:clamp(22px,2.2vw,40px);
    transform:translate(-50%,-50%);
    animation:starFly 1.7s cubic-bezier(.15,.9,.3,1) forwards;
    will-change:transform,opacity;
  }
  @keyframes starFly {
    0%   { opacity:1; transform:translate(-50%,-50%) scale(.3) rotate(0deg); }
    100% { opacity:0;
           transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty)))
                     scale(1.45) rotate(var(--rot)); }
  }
  .fx-float {
    position:absolute;
    font-size:clamp(28px,3.2vw,58px);
    font-weight:900; color:#FF9A5B;
    text-shadow:0 5px 0 #FFE0B8;
    transform:translate(-50%,-50%);
    animation:floatUp 1.6s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes floatUp {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.5); }
    25%  { opacity:1; transform:translate(-50%,-72%) scale(1.18); }
    100% { opacity:0; transform:translate(-50%,-200%) scale(1); }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">

  <div class="score-board">
    <span class="score-star">⭐</span>
    <span>积分</span>
    <span class="score-val" id="scoreVal">0</span>
  </div>

  <div class="topbar">
    <span>请搬</span>
    <span class="mission-num" id="targetNum">5</span>
    <span>颗豆子进篮子</span>
  </div>

  <button class="btn-finish" id="finishBtn" type="button">完 成</button>

  <div class="result-panel" id="resultPanel">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <div class="result-title" id="resultTitle">恭喜你，完成闯关！</div>
      <div class="result-detail" id="resultDetail">获得 5 分积分</div>
      <button class="btn-again" id="againBtn" type="button">再来一次</button>
    </div>
  </div>

  <div class="fx-layer" id="fxLayer"></div>

</div>

<script>
(function () {
  'use strict';

  /* ==================== DOM ==================== */
  const canvas      = document.getElementById('game');
  const ctx         = canvas.getContext('2d');
  const targetNumEl = document.getElementById('targetNum');
  const scoreValEl  = document.getElementById('scoreVal');
  const finishBtn   = document.getElementById('finishBtn');
  const resultPanel = document.getElementById('resultPanel');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultDetail= document.getElementById('resultDetail');
  const againBtn    = document.getElementById('againBtn');
  const fxLayer     = document.getElementById('fxLayer');

  /* ==================== 全局变量 ==================== */
  let W = 0, H = 0, DPR = 1;

  let groundR = 42;
  let basketR = 30;

  let basket = {
    x:0, topY:0, botY:0,
    topW:0, botW:0, rx:0, ry:0
  };

  let beans = [];
  let basketBeans = [];
  let clouds = [];
  let decors = [];
  let ants = [];

  let target = 5;
  let score  = 0;
  let phase  = 'play';
  let time   = 0;
  let countPulse = 0;

  /* ==================== 工具函数 ==================== */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function easeOutBack(x) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  /* ==================== 尺寸自适应 ==================== */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const m = Math.min(W, H);
    groundR = clamp(m * 0.042, 30, 52);
    basketR = groundR * 0.66;

    /* 篮子几何（略下移，给上方大数字留空间） */
    basket.x     = W * 0.805;
    basket.topY  = H * 0.525;
    basket.botY  = H * 0.905;
    basket.topW  = W * 0.300;
    basket.botW  = W * 0.232;
    basket.rx    = basket.topW / 2;
    basket.ry    = basket.rx * 0.30;

    buildDecor();
    buildAnts();
  }

  /* ==================== 背景装饰 ==================== */
  function buildDecor() {
    clouds = [];
    decors = [];

    for (let i = 0; i < 5; i++) {
      clouds.push({
        x: Math.random() * (W + 500) - 250,
        y: H * rand(0.04, 0.20),
        s: rand(0.55, 1.05),
        speed: rand(7, 17),
        alpha: rand(0.62, 0.92)
      });
    }

    for (let i = 0; i < 52; i++) {
      const px = Math.random() * W;
      const py = H * rand(0.50, 0.99);
      decors.push({
        x: px, y: py,
        type: Math.random() < 0.70 ? 'grass' : 'flower',
        s: rand(0.7, 1.45),
        hue: Math.floor(rand(0, 4)),
        phase: Math.random() * Math.PI * 2
      });
    }
    decors.sort(function (a, b) { return a.y - b.y; });
  }

  /* ==================== 左下一群蚂蚁 ==================== */
  function buildAnts() {
    ants = [];
    const n = 5;

    for (let i = 0; i < n; i++) {
      const baseX = W * (0.045 + i * 0.062);
      ants.push({
        x: baseX,
        y: H * (0.875 + (i % 2) * 0.040),
        scale: 0.62 + (i % 3) * 0.11,
        phase: Math.random() * Math.PI * 2,
        speed: rand(6, 13),
        dir: i % 2 === 0 ? 1 : -1,
        rangeMin: W * 0.025,
        rangeMax: W * 0.335,
        flip: 1
      });
    }
  }

  /* ==================== 新一轮 ==================== */
  function newRound() {
    phase = 'play';
    beans = [];
    basketBeans = [];
    time = 0;
    countPulse = 0;

    const total = 6 + Math.floor(Math.random() * 4);
    target = 2 + Math.floor(Math.random() * (total - 2));
    if (target >= total) target = total - 1;
    targetNumEl.textContent = target;

    const r = groundR;
    const area = {
      x0: W * 0.050 + r,
      x1: W * 0.625 - r,
      y0: H * 0.475 + r,
      y1: H * 0.815 - r
    };

    let minD = r * 2.45;
    const pts = [];
    let tries = 0;

    while (pts.length < total && tries < 14000) {
      tries++;
      const x = rand(area.x0, area.x1);
      const y = rand(area.y0, area.y1);

      let ok = true;
      for (let i = 0; i < pts.length; i++) {
        const dx = pts[i].x - x, dy = pts[i].y - y;
        if (dx * dx + dy * dy < minD * minD) { ok = false; break; }
      }
      if (ok) pts.push({ x: x, y: y });
      else if (tries % 400 === 0) minD = Math.max(minD * 0.9, r * 1.95);
    }
    while (pts.length < total) {
      pts.push({ x: rand(area.x0, area.x1), y: rand(area.y0, area.y1) });
    }

    for (let i = 0; i < pts.length; i++) {
      beans.push({
        x: pts[i].x,
        y: pts[i].y,
        gx: pts[i].x,
        gy: pts[i].y,
        r: groundR,
        rot: rand(-0.42, 0.42),
        phase: rand(0, Math.PI * 2),
        bob: rand(2.0, 4.0),
        scale: 0,
        spawnDelay: i * 0.075 + rand(0, 0.05),
        inBasket: false,
        flying: false,
        t: 0,
        fx: 0, fy: 0, tx: 0, ty: 0,
        rFrom: groundR, rTo: groundR,
        flash: 0
      });
    }

    resultPanel.classList.remove('show');
    finishBtn.disabled = false;
  }

  /* ==================== 篮内槽位 ==================== */
  function getSlotPos(i, n) {
    const maxPerRow = 5;
    const usable = basket.rx * 1.55;
    const spacing = Math.min(basketR * 2.45, usable / maxPerRow);

    const row = Math.floor(i / maxPerRow);
    const col = i % maxPerRow;
    const inRow = Math.min(maxPerRow, n - row * maxPerRow);
    const startX = basket.x - (inRow - 1) * spacing / 2;

    return {
      x: startX + col * spacing,
      y: basket.topY + basket.ry * 0.34 - row * basketR * 1.88
    };
  }

  /* ==================== 拾取 / 放回 ==================== */
  function pickBean(b) {
    if (b.inBasket || b.flying) return;

    const idx = basketBeans.length;
    const slot = getSlotPos(idx, idx + 1);

    b.flying   = true;
    b.inBasket = true;
    b.t        = 0;
    b.fx = b.x;    b.fy = b.y;
    b.tx = slot.x; b.ty = slot.y;
    b.rFrom = b.r;
    b.rTo   = basketR;
    b.flash = 1;

    basketBeans.push(b);
    countPulse = 1;
  }

  function unloadBean(b) {
    const i = basketBeans.indexOf(b);
    if (i < 0) return;

    basketBeans.splice(i, 1);
    b.inBasket = false;
    b.flying   = false;
    b.r = groundR;
    b.x = b.gx;
    b.y = b.gy;
    b.scale = 0.45;
    b.flash = 1;

    countPulse = 1;
  }

  /* ==================== 完成判定 ==================== */
  function checkFinish() {
    if (phase !== 'play') return;

    for (let i = 0; i < basketBeans.length; i++) {
      if (basketBeans[i].flying) return;
    }

    phase = 'result';
    finishBtn.disabled = true;

    const got = basketBeans.length;

    if (got === target) {
      score += target;
      scoreValEl.textContent = score;

      resultEmoji.textContent = '🎉';
      resultTitle.className   = 'result-title ok';
      resultTitle.textContent = '恭喜你，完成闯关！';
      resultDetail.textContent= '搬对 ' + target + ' 颗豆子，获得 ' + target + ' 分积分';

      burstStars();
      floatText('+' + target + ' 分', '#FF9A5B');

      setTimeout(function () { resultPanel.classList.add('show'); }, 950);
    } else {
      resultEmoji.textContent = '🌱';
      resultTitle.className   = 'result-title fail';
      resultTitle.textContent = '再接再厉！';
      resultDetail.textContent= '篮子里有 ' + got + ' 颗，任务要 ' + target + ' 颗哦';

      setTimeout(function () { resultPanel.classList.add('show'); }, 750);
    }
  }

  /* ==================== 特效 ==================== */
  function burstStars() {
    const cx = W / 2, cy = H * 0.44;
    const icons = ['⭐', '✨', '🌟', '💫', '🎊', '🫘', '🐜'];

    for (let i = 0; i < 46; i++) {
      const el = document.createElement('div');
      el.className = 'fx-star';
      el.textContent = icons[i % icons.length];
      el.style.left = cx + 'px';
      el.style.top  = cy + 'px';

      const ang  = Math.random() * Math.PI * 2;
      const dist = rand(150, Math.min(W, H) * 0.58);

      el.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(1) + 'px');
      el.style.setProperty('--ty', (Math.sin(ang) * dist).toFixed(1) + 'px');
      el.style.setProperty('--rot', rand(-420, 420).toFixed(0) + 'deg');
      el.style.animationDelay = (Math.random() * 0.16).toFixed(2) + 's';

      fxLayer.appendChild(el);
      setTimeout(function () { el.remove(); }, 2500);
    }
  }

  function floatText(txt, color) {
    const el = document.createElement('div');
    el.className = 'fx-float';
    el.textContent = txt;
    el.style.color = color;
    el.style.left = (W / 2) + 'px';
    el.style.top  = (H * 0.5) + 'px';
    fxLayer.appendChild(el);
    setTimeout(function () { el.remove(); }, 1800);
  }

  /* ==================== 更新 ==================== */
  function update(dt) {
    time += dt;

    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.x += c.speed * dt;
      if (c.x > W + 320) {
        c.x = -320;
        c.y = H * rand(0.04, 0.20);
      }
    }

    for (let i = 0; i < ants.length; i++) {
      const a = ants[i];
      a.x += a.dir * a.speed * dt;

      if (a.x > a.rangeMax) { a.x = a.rangeMax; a.dir = -1; }
      if (a.x < a.rangeMin) { a.x = a.rangeMin; a.dir = 1; }

      a.phase += dt * 6.2;
      a.flip = a.dir >= 0 ? 1 : -1;
    }

    if (countPulse > 0) countPulse = Math.max(0, countPulse - dt * 2.8);

    for (let i = 0; i < beans.length; i++) {
      const b = beans[i];
      const st = clamp((time - b.spawnDelay) / 0.52, 0, 1);
      b.scale = st <= 0 ? 0 : easeOutBack(st);
      if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 2.4);
    }

    const n = basketBeans.length;
    for (let i = 0; i < n; i++) {
      const b = basketBeans[i];
      const slot = getSlotPos(i, n);

      if (b.flying) {
        b.t += dt * 1.5;
        const t = Math.min(b.t, 1);
        const e = 1 - Math.pow(1 - t, 3);
        const arc = Math.sin(t * Math.PI) * (H * 0.15);

        b.x = b.fx + (b.tx - b.fx) * e;
        b.y = b.fy + (b.ty - b.fy) * e - arc;
        b.rot += dt * 6.5 * (1 - t);
        b.r = b.rFrom + (b.rTo - b.rFrom) * e;

        if (t >= 1) {
          b.flying = false;
          b.x = slot.x;
          b.y = slot.y;
          b.r = basketR;
          b.rot = rand(-0.35, 0.35);
        }
      } else {
        const k = 1 - Math.pow(0.0025, dt);
        b.x += (slot.x - b.x) * k;
        b.y += (slot.y - b.y) * k;
      }
    }

    for (let i = 0; i < beans.length; i++) {
      const b = beans[i];
      if (!b.inBasket && Math.abs(b.r - groundR) > 0.5) {
        b.r += (groundR - b.r) * (1 - Math.pow(0.004, dt));
      }
    }
  }

  /* ==================== 背景绘制 ==================== */
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
    g.addColorStop(0,    '#BFE8FF');
    g.addColorStop(0.50, '#DFF3FF');
    g.addColorStop(1,    '#F7FDFF');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawSun() {
    const sx = W * 0.105, sy = H * 0.125;
    const r = Math.min(W, H) * 0.056;

    const gg = ctx.createRadialGradient(sx, sy, r * 0.6, sx, sy, r * 4.4);
    gg.addColorStop(0,   'rgba(255,232,150,0.55)');
    gg.addColorStop(0.4, 'rgba(255,236,170,0.18)');
    gg.addColorStop(1,   'rgba(255,240,190,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 4.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(time * 0.12);
    ctx.strokeStyle = 'rgba(255,225,140,0.42)';
    ctx.lineWidth = Math.max(2, r * 0.11);
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.35);
      ctx.lineTo(Math.cos(a) * r * 1.72, Math.sin(a) * r * 1.72);
      ctx.stroke();
    }
    ctx.restore();

    const sg = ctx.createRadialGradient(sx - r * 0.3, sy - r * 0.3, 0, sx, sy, r);
    sg.addColorStop(0,   '#FFF7CC');
    sg.addColorStop(0.6, '#FFE38C');
    sg.addColorStop(1,   '#FFCE5C');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(190,140,50,0.72)';
    ctx.beginPath();
    ctx.arc(sx - r * 0.34, sy - r * 0.10, r * 0.105, 0, Math.PI * 2);
    ctx.arc(sx + r * 0.34, sy - r * 0.10, r * 0.105, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx, sy + r * 0.12, r * 0.35, 0.16 * Math.PI, 0.84 * Math.PI);
    ctx.strokeStyle = 'rgba(190,140,50,0.72)';
    ctx.lineWidth = Math.max(1.8, r * 0.095);
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(sx - r * 0.58, sy + r * 0.24, r * 0.155, 0, Math.PI * 2);
    ctx.arc(sx + r * 0.58, sy + r * 0.24, r * 0.155, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,155,130,0.42)';
    ctx.fill();
  }

  function drawCloud(x, y, s, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#FFFFFF';

    const parts = [
      { x: -50, y: 15, r: 30 },
      { x: -14, y: -8, r: 39 },
      { x: 30,  y: 5,  r: 33 },
      { x: 66,  y: 17, r: 24 }
    ];
    for (let i = 0; i < parts.length; i++) {
      ctx.beginPath();
      ctx.arc(parts[i].x, parts[i].y, parts[i].r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawClouds() {
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      drawCloud(c.x, c.y, c.s, c.alpha);
    }
  }

  function drawHill(yBase, amp, color, phase, freq) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, yBase);
    for (let x = 0; x <= W; x += 10) {
      const y = yBase
        + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.42;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawGround() {
    drawHill(H * 0.400, H * 0.030, '#CDEBB6', 0.9, 0.0035);
    drawHill(H * 0.455, H * 0.026, '#AEDD90', 2.4, 0.0048);
    drawHill(H * 0.505, H * 0.022, '#93CE7A', 4.1, 0.0058);

    const g = ctx.createLinearGradient(0, H * 0.52, 0, H);
    g.addColorStop(0, 'rgba(147,206,122,0)');
    g.addColorStop(1, 'rgba(110,175,92,0.44)');
    ctx.fillStyle = g;
    ctx.fillRect(0, H * 0.52, W, H * 0.48);
  }

  function drawDecor() {
    for (let i = 0; i < decors.length; i++) {
      const d = decors[i];
      const sway = Math.sin(time * 1.4 + d.phase) * 0.10;

      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.scale(d.s, d.s);
      ctx.rotate(sway);

      if (d.type === 'grass') {
        ctx.strokeStyle = 'rgba(96,170,80,0.78)';
        ctx.lineWidth = 2.8;
        ctx.lineCap = 'round';

        for (let k = -1; k <= 1; k++) {
          ctx.beginPath();
          ctx.moveTo(k * 4.5, 0);
          ctx.quadraticCurveTo(k * 7.5, -10, k * 11 + k * 3.5, -20);
          ctx.stroke();
        }
      } else {
        ctx.strokeStyle = 'rgba(96,170,80,0.82)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -15);
        ctx.stroke();

        const colors = ['#FFC7D8', '#FFE7A8', '#CDD9FF', '#FFD1B0'];
        ctx.fillStyle = colors[d.hue];
        for (let k = 0; k < 5; k++) {
          const a = (k / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 5.0, -15 + Math.sin(a) * 5.0, 4.0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(0, -15, 3.0, 0, Math.PI * 2);
        ctx.fillStyle = '#FFD75E';
        ctx.fill();
      }

      ctx.restore();
    }
  }

  /* ==================== 单只小蚂蚁 ==================== */
  function drawOneAnt(a) {
    const baseS = Math.min(W, H) / 900;
    const s = a.scale * baseS * 1.05;

    const bodyY = a.y + Math.sin(time * 2.0 + a.phase * 0.1) * 2.6;
    const wob   = Math.sin(a.phase) * 0.22;

    ctx.save();
    ctx.translate(a.x, bodyY);
    ctx.scale(s * a.flip, s);

    ctx.beginPath();
    ctx.ellipse(0, 22, 34, 8.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(96,140,72,0.24)';
    ctx.filter = 'blur(4px)';
    ctx.fill();
    ctx.filter = 'none';

    ctx.strokeStyle = '#3E2A1E';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const bx = -14 + i * 14;
      const sw = Math.sin(a.phase * 1.8 + i * 1.4) * 3.6;
      ctx.beginPath();
      ctx.moveTo(bx, 6);
      ctx.lineTo(bx - 5, 18 + sw);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx, 6);
      ctx.lineTo(bx + 6, 18 - sw);
      ctx.stroke();
    }

    const bodyParts = [
      { x: -19, y: 2,  rx: 11.5, ry: 10.5 },
      { x: 0,   y: -2, rx: 12.5, ry: 11.5 },
      { x: 19,  y: -6, rx: 13.5, ry: 12.5 }
    ];
    for (let i = 0; i < bodyParts.length; i++) {
      const p = bodyParts[i];
      const g = ctx.createRadialGradient(p.x - 4, p.y - 5, 1, p.x, p.y, p.rx * 1.4);
      g.addColorStop(0, '#6B4630');
      g.addColorStop(1, '#3E2A1E');
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    }

    ctx.strokeStyle = '#3E2A1E';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(28, -14);
    ctx.quadraticCurveTo(38, -26 + wob * 4, 46, -30 + wob * 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(24, -16);
    ctx.quadraticCurveTo(32, -30 - wob * 4, 38, -36 - wob * 6);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(46, -30 + wob * 6, 3.6, 0, Math.PI * 2);
    ctx.arc(38, -36 - wob * 6, 3.6, 0, Math.PI * 2);
    ctx.fillStyle = '#3E2A1E';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(22, -9, 3.4, 0, Math.PI * 2);
    ctx.arc(30, -7, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(23, -9, 1.8, 0, Math.PI * 2);
    ctx.arc(31, -7, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = '#241812';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(20, -2, 3.4, 0, Math.PI * 2);
    ctx.arc(32, 0, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,150,140,0.45)';
    ctx.fill();

    ctx.restore();
  }

  function drawAnts() {
    for (let i = 0; i < ants.length; i++) {
      drawOneAnt(ants[i]);
    }
  }

  /* ==================== 篮子绘制 ==================== */
  function drawBasket() {
    const cx = basket.x;
    const topY = basket.topY;
    const botY = basket.botY;
    const rx = basket.rx;
    const ry = basket.ry;
    const botHalf = basket.botW / 2;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, botY + ry * 0.4, botHalf * 1.18, ry * 0.76, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(96,140,72,0.24)';
    ctx.filter = 'blur(10px)';
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.moveTo(cx - rx, topY);
    ctx.bezierCurveTo(
      cx - rx * 0.99, topY + (botY - topY) * 0.52,
      cx - botHalf,    topY + (botY - topY) * 0.76,
      cx - botHalf,    botY
    );
    ctx.quadraticCurveTo(cx, botY + ry * 0.86, cx + botHalf, botY);
    ctx.bezierCurveTo(
      cx + botHalf,    topY + (botY - topY) * 0.76,
      cx + rx * 0.99,  topY + (botY - topY) * 0.52,
      cx + rx,         topY
    );
    ctx.closePath();

    const bg = ctx.createLinearGradient(cx - rx, topY, cx + rx, botY);
    bg.addColorStop(0,    '#EDC591');
    bg.addColorStop(0.30, '#D9A96C');
    bg.addColorStop(0.70, '#C28E4E');
    bg.addColorStop(1,    '#A2703A');
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.save();
    ctx.clip();

    ctx.strokeStyle = 'rgba(150,100,50,0.28)';
    ctx.lineWidth = Math.max(1.6, rx * 0.014);

    for (let i = 1; i <= 9; i++) {
      const y = topY + (botY - topY) * (i / 10);
      const spread = 1 - (i / 10) * 0.22;
      ctx.beginPath();
      ctx.moveTo(cx - rx * spread, y);
      ctx.quadraticCurveTo(cx, y + ry * 0.44, cx + rx * spread, y);
      ctx.stroke();
    }

    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * rx * 0.19, topY - ry * 0.5);
      ctx.quadraticCurveTo(
        cx + i * rx * 0.17, (topY + botY) / 2,
        cx + i * rx * 0.118, botY + ry * 0.5
      );
      ctx.stroke();
    }
    ctx.restore();

    ctx.beginPath();
    ctx.ellipse(cx, topY, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#7A5230';
    ctx.fill();

    const ig = ctx.createRadialGradient(cx, topY + ry * 0.3, 0, cx, topY + ry * 0.3, rx);
    ig.addColorStop(0, 'rgba(0,0,0,0)');
    ig.addColorStop(1, 'rgba(0,0,0,0.44)');
    ctx.beginPath();
    ctx.ellipse(cx, topY, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = ig;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(cx, topY, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#B57F42';
    ctx.lineWidth = Math.max(6, rx * 0.056);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx, topY, rx - rx * 0.036, ry - ry * 0.15, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,235,200,0.58)';
    ctx.lineWidth = Math.max(2.2, rx * 0.019);
    ctx.stroke();
  }

  /* ==================== 篮子上的超大数字（醒目） ==================== */
  function drawBasketBadge() {
    const baseR = Math.min(W, H) * 0.072;   // 加大
    const pulse = 1 + countPulse * 0.28;
    const r = baseR * pulse;

    const bx = basket.x;
    const by = basket.topY - basket.ry - baseR * 1.02;

    /* 外圈金色光晕（加强） */
    const halo = ctx.createRadialGradient(bx, by, r * 0.5, bx, by, r * 2.3);
    halo.addColorStop(0,   'rgba(255,205,120,0.55)');
    halo.addColorStop(0.5, 'rgba(255,210,130,0.24)');
    halo.addColorStop(1,   'rgba(255,214,140,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(bx, by, r * 2.3, 0, Math.PI * 2);
    ctx.fill();

    /* 底板圆：暖白渐变 */
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.38, r * 0.08, bx, by, r);
    g.addColorStop(0,   '#FFFFFF');
    g.addColorStop(0.55,'#FFF7E6');
    g.addColorStop(1,   '#FFE0B4');
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(200,145,80,0.5)';
    ctx.shadowBlur = 34;
    ctx.fill();
    ctx.shadowBlur = 0;

    /* 金边（加粗） */
    ctx.beginPath();
    ctx.arc(bx, by, r * 0.90, 0, Math.PI * 2);
    ctx.strokeStyle = '#FFC157';
    ctx.lineWidth = Math.max(4.5, r * 0.11);
    ctx.stroke();

    /* 白色外圈 */
    ctx.beginPath();
    ctx.arc(bx, by, r * 0.997, 0, Math.PI * 2);
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = Math.max(4, r * 0.10);
    ctx.stroke();

    /* 内圈细金线 */
    ctx.beginPath();
    ctx.arc(bx, by, r * 0.78, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,200,120,0.6)';
    ctx.lineWidth = Math.max(1.8, r * 0.035);
    ctx.stroke();

    /* 超大数字：橙红渐变 + 描边 */
    const numFont = '900 ' + (r * 1.55).toFixed(0) +
                    'px "Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif';
    ctx.font = numFont;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const numGrad = ctx.createLinearGradient(bx, by - r * 0.7, bx, by + r * 0.7);
    numGrad.addColorStop(0,   '#FF8A47');
    numGrad.addColorStop(0.5, '#F26A2E');
    numGrad.addColorStop(1,   '#D9501B');

    /* 白色外描边 */
    ctx.lineWidth = Math.max(6, r * 0.16);
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineJoin = 'round';
    ctx.strokeText(String(basketBeans.length), bx, by + r * 0.06);

    /* 阴影 */
    ctx.shadowColor = 'rgba(200,90,30,0.5)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 4;

    /* 数字本体 */
    ctx.fillStyle = numGrad;
    ctx.fillText(String(basketBeans.length), bx, by + r * 0.06);

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    /* 小字标签 */
    ctx.font = '900 ' + (baseR * 0.46).toFixed(0) +
               'px "Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif';
    ctx.lineWidth = Math.max(4, baseR * 0.10);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeText('篮中豆子', bx, by + r + baseR * 0.72);

    ctx.fillStyle = '#B87A42';
    ctx.fillText('篮中豆子', bx, by + r + baseR * 0.72);
  }

  /* ==================== 芸豆路径 ==================== */
  function beanPath(w, h) {
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.bezierCurveTo( 0.50 * w, -h * 1.00,  0.92 * w, -h * 0.80,  0.97 * w, -h * 0.50);
    ctx.bezierCurveTo( 0.99 * w, -h * 0.28,  0.88 * w, -h * 0.06,  0.62 * w,  0);
    ctx.bezierCurveTo( 0.88 * w,  h * 0.06,  0.99 * w,  h * 0.28,  0.97 * w,  h * 0.50);
    ctx.bezierCurveTo( 0.92 * w,  h * 0.80,  0.50 * w,  h * 1.00,  0,        h);
    ctx.bezierCurveTo(-0.55 * w,  h * 1.00, -0.98 * w,  h * 0.75, -1.00 * w,  h * 0.32);
    ctx.bezierCurveTo(-1.02 * w,  h * 0.05, -1.02 * w, -h * 0.05, -1.00 * w, -h * 0.32);
    ctx.bezierCurveTo(-0.98 * w, -h * 0.75, -0.55 * w, -h * 1.00,  0,       -h);
    ctx.closePath();
  }

  /* ==================== 绘制芸豆 ==================== */
  function drawBean(b) {
    if (b.scale <= 0.012) return;

    const w = b.r;
    const h = b.r * 1.13;

    let bx = b.x, by = b.y;

    if (!b.inBasket) {
      by += Math.sin(time * 1.7 + b.phase) * b.bob;
      bx += Math.cos(time * 1.2 + b.phase) * b.bob * 0.55;
    }

    const rot = b.rot + (b.inBasket ? 0 : Math.sin(time * 1.1 + b.phase) * 0.07);

    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(rot);
    ctx.scale(b.scale, b.scale);

    if (!b.inBasket) {
      ctx.beginPath();
      ctx.ellipse(0, h * 0.88, w * 0.94, h * 0.30, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(96,140,72,0.20)';
      ctx.filter = 'blur(5px)';
      ctx.fill();
      ctx.filter = 'none';
    }

    beanPath(w, h);

    if (b.flash > 0) {
      ctx.shadowColor = 'rgba(255,235,160,' + b.flash.toFixed(2) + ')';
      ctx.shadowBlur = 38 * b.flash;
    } else {
      ctx.shadowColor = 'rgba(180,140,90,0.32)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;
    }

    const g = ctx.createLinearGradient(-w * 0.5, -h, w * 0.6, h);
    g.addColorStop(0,    '#FFF9EC');
    g.addColorStop(0.34, '#F8E2B8');
    g.addColorStop(0.70, '#E6C28B');
    g.addColorStop(1,    '#C99A5E');
    ctx.fillStyle = g;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.shadowColor = 'transparent';

    ctx.save();
    ctx.clip();

    const hg = ctx.createRadialGradient(
      -w * 0.30, -h * 0.46, 0,
      -w * 0.30, -h * 0.46, w * 1.35
    );
    hg.addColorStop(0,    'rgba(255,255,255,0.94)');
    hg.addColorStop(0.44, 'rgba(255,255,255,0.18)');
    hg.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(-w * 2, -h * 2, w * 4, h * 4);

    const dg = ctx.createLinearGradient(0, h * 0.24, 0, h);
    dg.addColorStop(0, 'rgba(150,100,45,0)');
    dg.addColorStop(1, 'rgba(140,90,40,0.34)');
    ctx.fillStyle = dg;
    ctx.fillRect(-w * 2, -h * 2, w * 4, h * 4);

    ctx.restore();

    beanPath(w, h);
    ctx.strokeStyle = 'rgba(168,122,72,0.55)';
    ctx.lineWidth = Math.max(1.4, w * 0.055);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(w * 0.25, -h * 0.54);
    ctx.quadraticCurveTo(w * 0.62, 0, w * 0.25, h * 0.54);
    ctx.strokeStyle = 'rgba(172,122,62,0.30)';
    ctx.lineWidth = Math.max(1.1, w * 0.09);
    ctx.lineCap = 'round';
    ctx.stroke();

    const eyeY  = -h * 0.05;
    const eyeR  = w * 0.115;
    const eyeDX = w * 0.245;

    ctx.beginPath();
    ctx.arc(-eyeDX, eyeY, eyeR, 0, Math.PI * 2);
    ctx.arc( eyeDX, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(112,74,44,0.84)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-eyeDX + eyeR * 0.34, eyeY - eyeR * 0.36, eyeR * 0.36, 0, Math.PI * 2);
    ctx.arc( eyeDX + eyeR * 0.34, eyeY - eyeR * 0.36, eyeR * 0.36, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-w * 0.52, eyeY + h * 0.20, w * 0.155, 0, Math.PI * 2);
    ctx.arc( w * 0.56, eyeY + h * 0.20, w * 0.155, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,158,148,0.44)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, eyeY + h * 0.15, w * 0.14, 0.14 * Math.PI, 0.86 * Math.PI);
    ctx.strokeStyle = 'rgba(112,74,44,0.62)';
    ctx.lineWidth = Math.max(1.1, w * 0.062);
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.restore();
  }

  /* ==================== 渲染 ==================== */
  function render() {
    drawSky();
    drawSun();
    drawClouds();
    drawGround();
    drawDecor();

    drawAnts();

    for (let i = 0; i < basketBeans.length; i++) {
      drawBean(basketBeans[i]);
    }

    drawBasket();

    for (let i = 0; i < beans.length; i++) {
      if (!beans[i].inBasket) drawBean(beans[i]);
    }

    drawBasketBadge();
  }

  /* ==================== 主循环 ==================== */
  let lastTime = performance.now();

  function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0)    dt = 0;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ==================== 点击交互 ==================== */
  canvas.addEventListener('pointerdown', function (e) {
    if (phase !== 'play') return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    for (let i = basketBeans.length - 1; i >= 0; i--) {
      const b = basketBeans[i];
      if (b.flying) continue;
      if (Math.hypot(mx - b.x, my - b.y) < b.r * 1.5) {
        unloadBean(b);
        return;
      }
    }

    for (let i = beans.length - 1; i >= 0; i--) {
      const b = beans[i];
      if (b.inBasket || b.flying) continue;

      const by = b.y + Math.sin(time * 1.7 + b.phase) * b.bob;
      const bx = b.x + Math.cos(time * 1.2 + b.phase) * b.bob * 0.55;

      if (Math.hypot(mx - bx, my - by) < b.r * 1.55) {
        pickBean(b);
        return;
      }
    }
  });

  /* ==================== 按钮事件 ==================== */
  finishBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    checkFinish();
  });

  againBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    newRound();
  });

  /* ==================== 尺寸变化 ==================== */
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resize();
    }, 130);
  });

  /* ==================== 启动 ==================== */
  resize();
  newRound();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
